name: Generate Reality Cube

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install jinja2 playwright
          playwright install chromium

      - name: Generate cube
        run: python generate_cube.py

      - name: Bump version if HTML changed
        run: |
          if ! git diff --quiet index.html; then
            # Extract current version and bump patch
            CURRENT=$(grep -oP '__VERSION__ = "\K[0-9]+\.[0-9]+\.[0-9]+' __init__.py)
            MAJOR=$(echo $CURRENT | cut -d. -f1)
            MINOR=$(echo $CURRENT | cut -d. -f2)
            PATCH=$(echo $CURRENT | cut -d. -f3)
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
            sed -i "s/__VERSION__ = \"$CURRENT\"/__VERSION__ = \"$NEW_VERSION\"/" __init__.py
            echo "Bumped version: $CURRENT -> $NEW_VERSION"
            # Regenerate with new version
            python generate_cube.py
          else
            echo "No HTML changes, skipping version bump"
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html reality_cube.png __init__.py
          if ! git diff --staged --quiet; then
            git commit -m "Update generated files"
            git push
          else
            echo "No changes to commit"
          fi
